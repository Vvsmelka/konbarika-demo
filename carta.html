<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Carta · Konba Rika</title>
  <meta name="description" content="Carta digital de Konba Rika, Barrika: picoteo, menú del día y vinos.">
  <meta name="theme-color" content="#2a9c99">
  <link rel="stylesheet" href="assets/css/fonts-bricolage.css">
  <link rel="stylesheet" href="assets/vendor/phosphor/style.css">
  <link rel="stylesheet" href="assets/css/site.css?v=3">
  <style>
    body { font-size: 16px; }
    .c-head { position: relative; background: var(--sea); color: var(--paper); overflow: hidden; height: 300px; }
    .c-head .c-sun { position: absolute; left: 50%; bottom: 20px; width: 230px; height: 230px; transform: translateX(-50%); border-radius: 50%; background: var(--sun); }
    .c-head .c-sea { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; background: var(--ink); }
    .c-head .c-sea::before { content: ""; position: absolute; left: 0; right: 0; top: -13px; height: 14px; background: radial-gradient(circle at 14px 14px, var(--ink) 13.5px, transparent 14.5px) 0 0 / 28px 14px repeat-x; }
    .c-head .inner { position: relative; z-index: 2; max-width: 720px; margin: 0 auto; height: 100%; padding: 18px 20px 0; display: flex; flex-direction: column; }
    .c-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .c-top .brand { font-size: 1.6rem; color: var(--paper); }
    .mesa-chip { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 999px; background: var(--sand); color: var(--ink); border: 2px solid var(--ink); font-weight: 700; font-stretch: 85%; text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.86rem; box-shadow: 3px 3px 0 var(--ink); }
    .c-head h1 { margin-top: auto; margin-bottom: 86px; font-size: 5.2rem; line-height: 0.8; text-align: center; color: var(--paper); }
    .c-nav { position: sticky; top: 0; z-index: 10; background: var(--paper); border-bottom: 2px solid var(--ink); }
    .c-nav .inner { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; overflow-x: auto; padding: 12px 20px; scrollbar-width: none; }
    .c-nav .inner::-webkit-scrollbar { display: none; }
    .c-nav a { flex: 0 0 auto; height: 38px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; border: 2px solid var(--ink); text-decoration: none; font-weight: 700; font-stretch: 85%; text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.82rem; white-space: nowrap; }
    .c-nav a.is-active { background: var(--ink); color: var(--sand); }
    .c-main { max-width: 720px; margin: 0 auto; padding: 8px 20px 40px; }
    .c-sec { padding-top: 34px; scroll-margin-top: 70px; }
    .c-sec > h2 { font-size: 2.6rem; margin-bottom: 8px; display: flex; align-items: center; gap: 0.3em; }
    .c-sec > h2 i { color: var(--sun); font-size: 0.7em; }
    .c-sec .dish { padding: 10px 0; }
    .today { background: var(--sand); border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 22px; margin-top: 24px; }
    .today .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .today h2 { font-size: 2.4rem; }
    .today .p { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 3.6rem; line-height: 0.8; color: var(--ink); }
    .today h3 { font-size: 1.1rem; letter-spacing: 0.06em; color: var(--ink); margin: 18px 0 4px; }
    .today ul { list-style: none; margin: 0; padding: 0; }
    .today li { padding: 6px 0; border-bottom: 2px dotted rgba(21,35,59,0.3); }
    .today small { display: block; margin-top: 14px; font-weight: 500; }
    .highlight { margin-top: 20px; position: relative; background: var(--sun); border: 2px solid var(--ink); overflow: hidden; }
    .highlight img { width: 100%; height: 190px; object-fit: cover; filter: grayscale(1) contrast(1.2); mix-blend-mode: multiply; }
    .highlight div { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 14px 16px; border-top: 2px dashed rgba(21,35,59,0.55); }
    .highlight b { font-family: var(--display); font-weight: 800; font-stretch: 75%; text-transform: uppercase; font-size: 2rem; line-height: 0.9; display: block; }
    .highlight span { font-weight: 500; font-size: 0.9rem; }
    .highlight .pp { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 2.6rem; line-height: 0.8; }
    .wine h3 { font-size: 1.6rem; margin: 20px 0 4px; }
    .wine ul { list-style: none; margin: 0; padding: 0; }
    .wine li { padding: 7px 0; border-bottom: 2px dotted rgba(21,35,59,0.3); }
    .c-foot { max-width: 720px; margin: 0 auto; padding: 10px 20px 52px; display: grid; gap: 16px; }
    .c-foot p { color: var(--ink-70); font-size: 0.92rem; }
    .c-foot .btns { display: flex; gap: 12px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header class="c-head">
    <div class="c-sun" aria-hidden="true"></div>
    <div class="c-sea" aria-hidden="true"></div>
    <div class="inner">
      <div class="c-top">
        <a class="brand" href="index.html" style="text-decoration:none">Konba Rika</a>
        <span class="mesa-chip" id="mesaChip" hidden><i class="ph ph-fork-knife"></i> <span></span></span>
      </div>
      <h1>La carta</h1>
    </div>
  </header>

  <nav class="c-nav" aria-label="Secciones de la carta"><div class="inner" id="cNav"></div></nav>

  <main class="c-main" id="cMain"></main>

  <footer class="c-foot">
    <p>Precios con IVA incluido. Si tienes alguna alergia o intolerancia, avísanos y te indicamos los alérgenos de cada plato.</p>
    <div class="btns">
      <a class="btn btn-sm btn-sand" href="tel:+34946751276"><i class="ph ph-phone"></i> 946 75 12 76</a>
      <a class="btn btn-sm" href="index.html#cartelera"><i class="ph ph-calendar-plus"></i> Cartelera</a>
    </div>
  </footer>

  <script src="assets/js/data.js?v=3"></script>
  <script>
  (function () {
    var esc = KR.esc;
    var params = new URLSearchParams(location.search);
    var mesa = params.get("mesa");
    if (mesa) { var chip = document.getElementById("mesaChip"); chip.hidden = false; chip.querySelector("span").textContent = "Mesa " + mesa; }

    var agot = KR.getAgotados();
    var m = KR.getMenuDia();
    var html = "";
    var navItems = [["hoy", "Menú del día"]];

    function lista(t, arr) { return "<h3>" + t + "</h3><ul>" + (arr || []).filter(Boolean).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>"; }
    html += '<section class="c-sec" id="hoy" style="padding-top:22px"><div class="today">' +
      '<div class="row"><h2>Menú del día</h2><span class="p">' + esc(m.precio) + ' €</span></div>' +
      '<p style="font-weight:500;margin-top:6px">De lunes a viernes. ' + esc(m.aperitivo || "") + '</p>' +
      lista("Primeros", m.primeros) + lista("Segundos", m.segundos) + lista("Postres", m.postres) +
      '<small>' + esc(m.incluye || "") + '</small></div>' +
      '<div class="highlight"><img src="assets/img/p0377-sm.jpg" alt=""><div><span><b>Arroz con bogavante</b>Por encargo, pídelo al reservar</span><span class="pp">28 €</span></div></div></section>';

    KR.carta.forEach(function (g) {
      navItems.push([g.id, g.nombre]);
      html += '<section class="c-sec" id="' + g.id + '"><h2><i class="ph ph-sun" aria-hidden="true"></i>' + esc(g.nombre) + "</h2>" + g.platos.map(function (p) {
        var out = agot.indexOf(p.id) > -1;
        return '<div class="dish' + (out ? " is-out" : "") + '"><span class="name">' + esc(p.nombre) +
          (out ? '<span class="badge-out">Agotado hoy</span>' : "") +
          (p.nota ? '<span class="note">' + esc(p.nota) + "</span>" : "") +
          '</span><span class="dots" aria-hidden="true"></span><span class="price">' + esc(p.precio) + " €" + (p.unidad ? " <small>" + esc(p.unidad) + "</small>" : "") + "</span></div>";
      }).join("") + "</section>";
    });

    navItems.push(["vinos", "Vinos y vermut"]);
    html += '<section class="c-sec wine" id="vinos"><h2><i class="ph ph-sun" aria-hidden="true"></i>Vinos y vermut</h2>' + KR.vinos.map(function (g) {
      return "<h3>" + esc(g.grupo) + "</h3><ul>" + g.items.map(function (i) { return "<li>" + esc(i) + "</li>"; }).join("") + "</ul>";
    }).join("") + "</section>";

    document.getElementById("cMain").innerHTML = html;
    var nav = document.getElementById("cNav");
    nav.innerHTML = navItems.map(function (n) { return '<a href="#' + n[0] + '" data-id="' + n[0] + '">' + esc(n[1]) + "</a>"; }).join("");

    var links = Array.prototype.slice.call(nav.querySelectorAll("a"));
    function setActive(id) {
      links.forEach(function (a) {
        var on = a.dataset.id === id;
        a.classList.toggle("is-active", on);
        if (on) nav.scrollTo({ left: a.offsetLeft - 20, behavior: "smooth" });
      });
    }
    setActive("hoy");
    if ("IntersectionObserver" in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { if (e.isIntersecting) setActive(e.target.id); });
      }, { rootMargin: "-70px 0px -65% 0px" });
      document.querySelectorAll(".c-sec").forEach(function (s) { io.observe(s); });
    }
  })();
  </script>
</body>
</html>
